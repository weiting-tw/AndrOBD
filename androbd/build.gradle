apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 34
    defaultConfig {
        applicationId 'com.fr3ts0n.ecu.gui.androbd'
        minSdkVersion 17
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 34
        versionCode 20628
        versionName 'V2.6.16-API34-v17-simple'

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        lintOptions {
            // Override lint error on targetSdkVersion
            abortOnError false
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }

        kotlinOptions {
            jvmTarget = "17" // Ensure consistency with JavaVersion.VERSION_17
        }
    }

    applicationVariants.configureEach { variant ->
        variant.resValue "string", "app_version", variant.versionName
    }

    signingConfigs {
        config {
            // Secrets come from env (CI) or a gradle property (local, e.g.
            // ~/.gradle/gradle.properties — never committed). No hardcoded
            // passwords in source. Alias name is not a secret.
            storeFile file('../weiting-car.jks')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: (project.findProperty("KEYSTORE_PASSWORD") ?: "")
            keyAlias System.getenv("KEY_ALIAS") ?: (project.findProperty("KEY_ALIAS") ?: "weiting-key")
            keyPassword System.getenv("KEY_PASSWORD") ?: (project.findProperty("KEY_PASSWORD") ?: "")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.config
        }
        release {
            signingConfig signingConfigs.config
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }


    productFlavors {
    }
    lint {
        abortOnError false
    }
    namespace 'com.fr3ts0n.ecu.gui.androbd'
}

dependencies {
    implementation project(':mqttbuiltin')
    implementation project(':library')
    implementation 'androidx.core:core-ktx:1.12.0'
}
