apply plugin: 'java'

compileJava {
    options.incremental = true
}

sourceSets {
    main {
        java {
            exclude(
                    'com/fr3ts0n/common/res',
                    'com/fr3ts0n/pvs/gui',
                    'com/fr3ts0n/prot/gui',
                    'com/fr3ts0n/ecu/gui',
                    'com/fr3ts0n/ecu/prot/vag',
            )
        }
        resources {
            srcDirs("src/main/java")
            include('com/fr3ts0n/ecu/prot/obd/res/*')
        }
    }
}

test {
    useJUnitPlatform()
    // Run each test class in its own JVM. Several tests share mutable static
    // state (EcuDataItem.cnvSystem, byMnemonic map, conversion factors), so
    // without isolation one class can leak state into another and make the
    // suite order-dependent / flaky.
    forkEvery = 1
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.3'
}


java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}