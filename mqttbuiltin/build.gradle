// Built-in MQTT publisher (Home Assistant feed). Called directly by the AndrOBD
// background service — no plugin framework / broadcasts involved.
apply plugin: 'com.android.library'

android {
    compileSdk 34
    defaultConfig {
        // align minSdk with the app (17) so manifest merge doesn't conflict
        minSdkVersion 17
        targetSdkVersion 34
        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'com.fr3ts0n.androbd.plugin.mqtt'
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
