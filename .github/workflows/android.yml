name: Android CI/CD

on:
  push:
    branches: [ master, main ]
    # version tags (e.g. V2.6.16-API34-v15-simple) build the APK and publish a GitHub release
    tags: [ 'V*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create this tag + GitHub release with the APK (e.g. V2.6.16-API34-v15-simple). Empty = build only.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release on tag builds

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run library unit tests
      run: ./gradlew :library:test --stacktrace

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > weiting-car.jks

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndrOBD-Debug-APK
        path: androbd/build/outputs/apk/debug/*.apk

    - name: Clean up Keystore
      if: always()
      run: rm -f weiting-car.jks

    - name: Release APK (on tags / manual release_tag)
      if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag || github.ref_name }}
        target_commitish: ${{ github.sha }}
        name: AndrOBD ${{ inputs.release_tag || github.ref_name }}
        files: androbd/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
